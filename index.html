<!DOCTYPE html>
<html lang="en">
<head>

<title>GameZone</title>
<style>
* {box-sizing:border-box}
body {margin:0;background:#10111c;color:white;font-family:Arial,sans-serif}
header {background:#191b2c;padding:25px;text-align:center;border-bottom:2px solid #794cff}
h1 {color:#a78bfa;font-size:35px}
.container {max-width:1100px;margin:auto;padding:20px}
input {width:100%;padding:15px;border-radius:10px;border:2px solid #794cff;background:#202235;color:white;font-size:16px}
.categories {display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}
button {background:#794cff;color:white;border:0;padding:11px 15px;border-radius:8px;cursor:pointer}
button:hover {background:#9b7aff}
.games {display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:13px}
.game {background:#202235;padding:15px;border-radius:12px;text-align:center;border:1px solid #383951}
.game h3 {color:#c4b5fd}
.game button {width:100%;margin-top:7px}
footer {text-align:center;color:#777;padding:30px}
</style>
</head>

let currentFilter="All";
let favorites=JSON.parse(localStorage.getItem("gameFavorites")||"[]");
function filterGames(category){currentFilter=category;showGames()}
function showGames(){const search=document.getElementById("search").value.toLowerCase();const container=document.getElementById("games");container.innerHTML="";games.filter(game=>{const matchesSearch=game[0].toLowerCase().includes(search);const matchesCategory=currentFilter==="All"||(currentFilter==="Favorites"&&favorites.includes(game[0]))||game[1]===currentFilter;return matchesSearch&&matchesCategory}).forEach(game=>{const card=document.createElement("div");card.className="game";const title=document.createElement("h3");title.textContent=game[0];const category=document.createElement("p");category.textContent=game[1];const play=document.createElement("button");play.textContent="▶ Play";play.onclick=()=>window.open(game[2],"_blank","noopener,noreferrer");const favorite=document.createElement("button");favorite.textContent=favorites.includes(game[0])?"★ Favorited":"☆ Favorite";favorite.onclick=()=>{favorites=favorites.includes(game[0])?favorites.filter(n=>n!==game[0]):[...favorites,game[0]];localStorage.setItem("gameFavorites",JSON.stringify(favorites));showGames()};card.append(title,category,play,favorite);container.appendChild(card)})}
